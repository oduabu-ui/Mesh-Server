apiVersion: apps/v1
kind: Deployment
metadata:
  name: landmarknodejs
  namespace: staging
  labels:
    app: landmarknodejs
    environment: staging
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landmarknodejs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: landmarknodejs
        team: devops
        class: class42
        environment: staging
    spec:
      containers:
      - name: nodejs-app
        image: meshe41/landmark_nodejsapp:v2
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "100m"
        ports:
        - containerPort: 3000
        env:
        - name: NODE_ENV
          value: "staging"
---
apiVersion: v1
kind: Service
metadata:
  name: landmarknodejs-svc
  namespace: staging
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  selector:
    app: landmarknodejs
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
