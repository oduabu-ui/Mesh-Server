apiVersion: v1
kind: Service
metadata:
  name: landmarknodejs-lb
  namespace: staging
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
spec:
  selector:
    app: landmarknodejs
  type: LoadBalancer
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
