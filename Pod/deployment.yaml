apiVersion: apps/v1
kind: Deployment
metadata:
  name: landmarknodejs
  namespace: staging
  labels:
    app: landmarknodejs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: landmarknodejs
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: landmarknodejs
        team: devops
        class: class42
    spec:
      containers:
      - name: nodejs-app
        image: meshe41/landmark_nodejsapp:v2
        resources:
          limits:
            memory: "128Mi"
            cpu: "200m"
          requests:
            memory: "64Mi"
            cpu: "100m"
        ports:
        - containerPort: 3000
